<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome...</title>
  
  <!-- โหลดฟอนต์ Cinematic / Elegant จาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Prompt:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* พื้นหลังสีกรมท่าเข้มพิเศษ (Midnight Obsidian) */
      background: radial-gradient(circle at center, #0a1329 0%, #020612 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Cinzel', 'Prompt', serif;
      overflow: hidden;
    }

    /* ตัวหนังสือ Welcome สีทอง 3D หรูหรา */
    .welcome-text {
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: 12px;
      text-transform: uppercase;
      text-align: center;
      
      /* ไล่เฉดสีทอง */
      background: linear-gradient(135deg, #c5a059 0%, #fdf0a6 25%, #d4af37 50%, #fef9d7 75%, #a37c3f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      /* สร้างมิติ 3D คมชัดสุภาพ */
      text-shadow: 
        1px 1px 0px #826227,
        2px 2px 0px #614619,
        3px 3px 0px #3f2c0d,
        4px 4px 10px rgba(0, 0, 0, 0.9);

      /* เอฟเฟกต์ค่อยๆ สว่างขึ้นอย่างนุ่มนวล (Smooth Fade-In) */
      opacity: 0;
      animation: smoothFadeInGlow 1.2s ease-out forwards;
    }

    /* แอนิเมชัน ค่อยๆ สว่างขึ้นอย่างนุ่มนวล และส่องประกายทองก่อนเข้าเว็บ */
    @keyframes smoothFadeInGlow {
      0% {
        opacity: 0;
        transform: scale(0.95);
        filter: drop-shadow(0 0 0px rgba(212, 175, 55, 0));
      }
      60% {
        opacity: 0.8;
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.6));
      }
    }

    /* ข้อความแจ้งเตือนและลิงก์สำรองด้านล่าง */
    .redirect-info {
      margin-top: 40px;
      color: #8c9ba5;
      font-family: 'Prompt', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      letter-spacing: 1px;
      text-align: center;
      opacity: 0;
      animation: fadeInText 0.6s ease-in 0.8s forwards;
    }

    .redirect-info a {
      color: #d4af37;
      text-decoration: none;
      border-bottom: 1px solid rgba(212, 175, 55, 0.4);
      padding-bottom: 2px;
      transition: all 0.3s ease;
    }

    .redirect-info a:hover {
      color: #fff;
      border-bottom-color: #fff;
    }

    @keyframes fadeInText {
      to {
        opacity: 1;
      }
    }

    /* รองรับหน้าจอมือถือ */
    @media (max-width: 600px) {
      .welcome-text {
        font-size: 2.8rem;
        letter-spacing: 6px;
      }
      .redirect-info {
        font-size: 0.8rem;
        padding: 0 20px;
      }
    }
  </style>
</head>
<body>
