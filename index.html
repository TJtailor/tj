<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to TJ Tailorworks...</title>
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #1c2541;
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
        // ใส่ URL ที่ได้จาก Cloudflare Tunnel ในขั้นตอนที่ 3 ตรงนี้
        const SERVER_URL = "https://YOUR-TUNNEL-URL.trycloudflare.com"; 
        
        if (SERVER_URL.includes("YOUR-TUNNEL-URL")) {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("status").textContent = "กรุณาใส่ Cloudflare URL ในไฟล์ index.html";
            });
        } else {
            window.location.href = SERVER_URL;
        }
    </script>
</head>
<body>
    <div>
        <div class="loader"></div>
        <p id="status">กำลังเชื่อมต่อไปยัง TJ Tailorworks Server...</p>
    </div>
</body>
</html>
