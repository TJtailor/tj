<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TJ Tailorworks System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: #1c2541;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .loader {
            border: 4px solid #3a506b;
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 25px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 1.4rem;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p {
            font-size: 0.95rem;
            color: #a3cef1;
            line-height: 1.5;
        }
        .error-title {
            color: #FFD700;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }
        .maintenance-img {
            width: 100%;
            max-width: 140px; /* ปรับลดขนาดลงประมาณ 50% */
            height: auto;
            margin: 15px auto 10px;
            display: block;
            border-radius: 8px;
        }
        .contact-info {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #3a506b;
            font-size: 0.85rem;
            color: #8da9c4;
            line-height: 1.6;
        }
        .line-id {
            color: #5bc0be;
            font-weight: bold;
            word-break: break-all;
        }
    </style>
    <script>
        // วาง URL ที่ได้จาก Cloudflare Tunnel ตรงนี้
        const SERVER_URL = "https://forecasts-rapidly-calcium-accessed.trycloudflare.com"; 

        document.addEventListener("DOMContentLoaded", () => {
            const statusText = document.getElementById("status");
            const loader = document.getElementById("loader");
            const title = document.getElementById("title");
            const contactBox = document.getElementById("contactBox");
            const maintenanceImg = document.getElementById("maintenanceImg");

            // ฟังก์ชันสำหรับแสดงหน้าปิดปรับปรุงระบบ
            function showMaintenancePage() {
                loader.style.display = "none";
                title.textContent = "ปิดปรับปรุง";
                title.className = "error-title";
                statusText.textContent = "ขออภัยในความไม่สะดวก ขณะนี้ระบบไม่สามารถใช้งานได้ชั่วคราว";
                maintenanceImg.style.display = "block";
                contactBox.style.display = "block";
            }

            if (!SERVER_URL || SERVER_URL.includes("YOUR-TUNNEL-URL")) {
                showMaintenancePage();
                return;
            }

            // ตั้งระบบ Timeout กรณีเซิร์ฟเวอร์ค้าง ไม่ตอบรับภายใน 5 วินาที
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            // ทดสอบเชื่อมต่อไปยังปลายทางก่อนเปลี่ยนหน้า
            fetch(SERVER_URL, { mode: 'no-cors', signal: controller.signal })
                .then(() => {
                    clearTimeout(timeoutId);
                    // เชื่อมต่อได้ เปลี่ยนหน้าทันที
                    window.location.href = SERVER_URL;
                })
                .catch(error => {
                    clearTimeout(timeoutId);
                    // ไม่สามารถติดต่อปลายทางได้
                    console.error("Connection failed:", error);
                    showMaintenancePage();
                });
        });
    </script>
</head>
<body>
    <div class="container">
        <div id="loader" class="loader"></div>
        <h2 id="title">TJ Tailorworks</h2>
        <p id="status">กำลังเชื่อมต่อไปยังเซิร์ฟเวอร์...</p>
        
        <!-- รูปภาพแสดงเมื่อเข้าสู่หน้าปิดปรับปรุง (ย่อขนาดลง 50%) -->
        <img id="maintenanceImg" class="maintenance-img" src="https://img2.pic.in.th/Gemini_Generated_Image_b4gd4wb4gd4wb4gd-1.jpg" alt="ระบบปิดปรับปรุง" style="display: none;">
        
        <div id="contactBox" class="contact-info" style="display: none;">
            ติดต่อพี่ตั้มเพื่อสอบถามความคืบหน้าได้ที่<br>
            Line: <span class="line-id">@ satit_phochai_tum</span>
        </div>
    </div>
</body>
</html>
